
name: Docker CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-analyze-build:
    name: Test, analyze, and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install -e .; fi

      - name: Run pytest
        run: python -m pytest -v

      - name: Analyze Dockerfile with Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          tags: aaa-movie-prediction:ci
          push: false
          load: true

      - name: Start container
        run: |
          docker run -d \
            --name movie-api-test \
            -p 8000:8000 \
            aaa-movie-prediction:ci

      - name: Smoke test FastAPI
        run: |
          for i in $(seq 1 30); do
            if curl --fail --silent http://localhost:8000/docs > /dev/null; then
              echo "FastAPI is responding."
              exit 0
            fi

            echo "Waiting for FastAPI to start... ($i/30)"
            sleep 2
          done

          echo "FastAPI failed to start."
          docker logs movie-api-test
          exit 1

      - name: Show container logs on failure
        if: failure()
        run: docker logs movie-api-test || true

      - name: Clean up container
        if: always()
        run: |
          docker rm -f movie-api-test || true
