
name: Docker CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]
  workflow_dispatch:

permissions:
  contents: read
defaults:
  run:
    working-directory: aaa_movie_prediction

jobs:
  test-analyze-build:
    name: Test, analyze, and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: aaa_movie_prediction/pyproject.toml

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install pytest
        run: python -m pip install pytest

      - name: Install requirements.txt dependencies
        run: |
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi

      - name: Install project from pyproject.toml
        run: |
          test -f pyproject.toml || {
            echo "ERROR: pyproject.toml not found."
            exit 1
          }
          python -m pip install -e .

      - name: Verify project installation
        run: |
          python - <<'PY'
          import tomllib
          from importlib.metadata import distribution
          
          with open("pyproject.toml", "rb") as f:
              config = tomllib.load(f)
          
          project_name = config["project"]["name"]
          installed = distribution(project_name)
          
          print(f"SUCCESS: {installed.metadata['Name']} {installed.version} is installed.")
          print("Declared dependencies:", config["project"].get("dependencies", []))
          PY
          python -m pip check

      - name: Run tests
        run: python -m pytest -v

      - name: Analyze Dockerfile with Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: aaa_movie_prediction/Dockerfile
          failure-threshold: warning

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v6
        with:
          context: ./aaa_movie_prediction
          file: aaa_movie_prediction/Dockerfile
          tags: aaa_movie_prediction:ci
          push: false
          load: true

      - name: Verify Docker image
        run: docker image inspect aaa_movie_prediction:ci

      - name: Start container
        run: |
          docker run -d \
            --name movie-api-test \
            -p 8000:8000 \
            aaa_movie_prediction:ci

      - name: Smoke test FastAPI
        run: |
          for i in $(seq 1 30); do
            if curl --fail --silent http://localhost:8000/docs > /dev/null; then
              echo "FastAPI is responding."
              exit 0
            fi

            echo "Waiting for FastAPI to start... ($i/30)"
            sleep 2
          done

          echo "FastAPI failed to start."
          docker logs movie-api-test
          exit 1

      - name: Show container logs on failure
        if: failure()
        run: docker logs movie-api-test || true

      - name: Clean up container
        if: always()
        run: |
          docker rm -f movie-api-test || true
