[project]
name = "aaa_movie_prediction"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.162.0",
    "joblib>=1.6.0",
    "pytest>=9.1.1",
    "pandas",
    "numpy",
    "scikit-learn",
    "scipy",
]

[tool.pytest.ini_options]
testpaths = ["citest"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"