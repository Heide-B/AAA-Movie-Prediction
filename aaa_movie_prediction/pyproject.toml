[project]
name = "aaa_movie_prediction"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.162.0",
    "joblib>=1.6.0",
    "pytest>=9.1.1",
    "pandas==3.0.3",
    "numpy==2.0.2",
    "scikit-learn==1.6.1",
    "scipy==1.17.1",
]

[tool.pytest.ini_options]
testpaths = ["citest"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["models*"]
exclude = ["citests*", "data*"]
